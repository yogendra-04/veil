# Builds the Android APK on GitHub's servers.
# Actions tab → "Build Android APK" → latest run → download "veil-apk".
name: Build Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-24.04          # comes with the Android SDK preinstalled
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler/Gradle errors as annotations (readable without the full log)
          grep -E "^e: |error:|What went wrong|Could not|FAILURE|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: veil-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish APK as a Release (direct phone download)
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/*.apk Veil.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Veil.apk --title "Veil (latest build)" \
            --notes "Open this page on your Android phone and tap Veil.apk to install. Built from ${GITHUB_SHA::7}."
        env:
          GH_TOKEN: ${{ github.token }}
